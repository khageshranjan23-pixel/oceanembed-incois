[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "oceanembed-kit"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "xarray>=2024.1", "netCDF4>=1.6", "dask[array]>=2024.1", "gsw>=3.6", "torch>=2.2,<3", "scikit-learn>=1.4,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
data = ["copernicusmarine>=2,<3", "earthaccess>=0.14,<1"]
[tool.setuptools]
packages = ["oceanembed"]
